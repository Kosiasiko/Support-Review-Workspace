<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Review Workspace</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main>
    <header class="page-header">
      <h1>Support Review</h1>
      <p>Review the customer question, AI-drafted reply, and approved company knowledge.</p>
    </header>

    <section
      class="review-section"
      aria-labelledby="customer-question-heading"
    >
      <h2 id="customer-question-heading">Customer Question</h2>
      <p id="customer-question"></p>
    </section>

    <div class="comparison-grid">
      <section
        class="review-section"
        aria-labelledby="draft-reply-heading"
      >
        <h2 id="draft-reply-heading">AI-Drafted Reply</h2>
        <p id="ai-draft-reply"></p>
      </section>

      <section
        class="review-section"
        aria-labelledby="approved-knowledge-heading"
      >
        <h2 id="approved-knowledge-heading">Approved Company Knowledge</h2>

        <div class="knowledge-field">
          <h3>Knowledge Title</h3>
          <p id="knowledge-title"></p>
        </div>

        <div class="knowledge-field">
          <h3>Source</h3>
          <p id="knowledge-source"></p>
        </div>

        <div class="knowledge-field">
          <h3>Policy Text</h3>
          <p id="knowledge-policy"></p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
